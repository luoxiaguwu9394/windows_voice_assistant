# Windows Voice Assistant Configuration
# All paths relative to project root unless absolute

audio:
  input_device: "default"      # Audio input device (default = system default)
  sample_rate: 16000           # Sample rate for all audio processing
  half_duplex: true            # Pause ASR/VAD during TTS playback
  kws_during_tts: true         # Keep KWS active during TTS for barge-in

  # Output (playback). Deliberately separate from `sample_rate`, which is the
  # microphone's: the speaker is opened once at its own native rate and the TTS
  # audio is resampled to match. Writing an 8 kHz stream to a 44.1 kHz device
  # over MME (the old behaviour) handed a telephone-grade signal to the OS mixer.
  output_device: "default"
  output_sample_rate: 0        # 0 = 该路由自己的采样率（本机 WASAPI 48000 / MME 44100，
                               #     同一个扬声器两者不同，向 WASAPI 要 44100 会直接被拒）
  output_host_api: "auto"      # auto | wasapi | default  (auto = 先 WASAPI 共享，再 auto-convert，最后系统默认)
  output_prebuffer_ms: 250     # buffered before the first sound, so slow synthesis cannot leave a hole
  output_blocksize_ms: 20      # one device block; the player writes exactly this

kws:
  # Extracted from sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2
  model: "models/kws/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20"
  # English keywords must be said with English phonemes; the Chinese ones are
  # matched through the model's pinyin tokens, which is far more forgiving for
  # a Chinese accent. Say whichever is comfortable — all are active.
  keywords:
    - "assistant"
    - "小助手"
    - "你好助手"
  threshold: 0.25              # Detection threshold (0.0-1.0); lower = more sensitive
  use_int8: true               # false = fp32 encoder: more accurate, ~2.5x CPU

vad:
  # Silero VAD v5 (single .onnx file)
  model: "models/vad/silero_vad_v5.onnx"
  min_silence_ms: 500          # Minimum silence to end segment
  min_speech_ms: 250           # Minimum speech to start segment

asr:
  # SenseVoice int8 (zh/en/ja/ko/yue, ITN supported)
  model: "models/asr/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx"
  tokens: "models/asr/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/tokens.txt"
  language: "auto"             # auto, zh, en, ja, ko, yue
  use_itn: true                # inverse text normalization (punctuation)

sv:
  # sherpa-onnx speaker embedding model (3D-Speaker CAM++)
  model: "models/sv/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx"
  enabled: true
  profiles_dir: "models/sv/profiles"

  # Thresholds are WRITTEN BY THE ENROLLMENT TOOL; do not hand-edit.
  #   score >= threshold_high -> full
  #   score >= threshold_low  -> guest
  #   otherwise               -> rejected
  # threshold_high MUST be greater than threshold_low, otherwise the guest band
  # collapses and every score above the lower bar is promoted to "full".
  threshold_high: 0.60
  threshold_low: 0.40

  # Estimated similarity to the most similar NON-target speaker. This cannot be
  # measured from a single enrolled speaker, so it is an estimate (AISHELL-3 /
  # CN-Celeb reference range). Lower it if enrollment reports that T_high would
  # fall below T_low.
  max_inter: 0.45

  offset_high: 0.05            # margin subtracted from min_intra
  offset_low: 0.05             # margin added to max_inter
  min_gap: 0.05                # T_high must exceed T_low by at least this much

  adaptive_update: true        # Update embeddings on successful verification
  update_weight: 0.05          # EMA weight for adaptive update
  anchor_check_days: 30        # Days between anchor checks

llm:
  local:
    base_url: "http://localhost:8080/v1"   # llama.cpp server with GBNF grammar
    api_key: "ollama"
    model: "qwen2.5-3b-instruct"           # 小模型：3B 约 2.2GB (Q4_K_M)，灵耀14 Air 轻松跑满
    # 备选小模型：
    #   qwen2.5-1.5b-instruct  (~1.2GB, 极速，勉强够用)
    #   qwen2.5-3b-instruct    (~2.2GB, 推荐，平衡速度/质量)
    #   phi-3-mini-4k-instruct (~2.4GB, 指令遵循强)
    #   gemma-2-2b-instruct    (~1.6GB, 多语言好)
    #   llama-3.2-3b-instruct  (~2.0GB, 新架构)
    confidence_threshold: 0.65             # 小模型阈值略低，依赖 GBNF 保证格式

    # ── llama-server 托管（2026-09-27 起，见 winvoice/llm/server.py）──
    # true：助手启动时先探测 base_url 的 /health——已在跑就复用（关闭助手时也不
    # 动它），没在跑才按下面两项拉起并等健康检查通过；服务输出进 logs/llama-server.log。
    # 拉起失败不致命：规则指令/寒暄照常，问答明说「答不上来」。false = 手动模式。
    auto_start: true
    server_binary: "tools/llama-b7376-bin-win-cpu-x64/llama-server.exe"
    model_file: "models/llm/qwen2.5-3b-instruct-q4_k_m.gguf"
    server_context: 4096           # llama-server -c（上下文窗口）
    start_timeout_s: 60            # 模型加载等待上限；超时不杀进程，只如实报告未就绪
    server_args: []                # 附加命令行参数，例如 ["-ngl", "99"]

  ask:
    # 问答/闲聊（「什么是量子力学」「你好」）。规则层命中 ASK 后走这里：
    # 本地模型自由生成、纯文本进出，**没有工具能力**（不会弹浏览器、不会动文件）。
    enabled: true
    max_chars: 80               # 生成答案念出来的上限（再过滤拉丁字符/代码符号）
    max_tokens: 128             # 生成上限；3B CPU 约 10–20 token/s，超时会触发兜底话术
    timeout_s: 20               # 单次生成超时；超时明确说「答不上来」，不静默、不崩

  remote:
    # Off by default: this is a placeholder endpoint. Enable it and fill in a
    # real OpenAI-compatible base_url + API key before switching this to true.
    enabled: false
    base_url: "https://your-api-endpoint/v1"
    api_key: "${REMOTE_API_KEY}"  # Expanded from environment variable
    model: "gpt-4o"
    guest_allowed: false        # Guests cannot trigger cloud calls

tts:
  # ── Output audio ─────────────────────────────────────────────
  # matcha-icefall-zh-baker + the vocos-22khz-univ vocoder: 22 050 Hz.
  # The old vits-icefall-zh-aishell3 is natively 8 000 Hz (telephone grade) and
  # stays as the fallback: a machine that has not downloaded the new model keeps
  # speaking, with a tts_primary_model_missing warning at startup.
  # Download with:  python scripts/download_models.py --tts
  model: "models/tts/matcha-icefall-zh-baker"
  fallback_models:
    - "models/tts/vits-icefall-zh-aishell3"
  backend: "auto"              # auto | vits | matcha (auto = read it off the model directory)
  vocoder: ""                  # empty = vocos-22khz-univ.onnx / hifigan_v*.onnx inside the model dir
  voice: "default"             # default or guest
  guest_voice: "guest"
  speaker_id: 0                # the owner's speaker id
  guest_speaker_id: 1          # the guest's (a single-speaker model degrades to 0)
  # 语速是强杠杆：时长 ∝ 1/speed（Matcha 实测 1.15 → 87 %、1.3 → 77 %；VITS 更陡）。
  # 0.9 实测 ≈208 ms/字（4.8 字/秒），落在自然对话区间（4.5–5.5）中位——当前值。
  # 锚点：1.0 ≈ 193 ms/字（播报腔）、0.8 ≈ 241（偏慢）、0.75 ≈ 250（明显慢）。
  # 引擎只在 initialize() 读一次，改完要重启。
  speed: 0.9
  # 绝对值，不是相对主人的倍率。单说话人模型下访客只靠语速区分音色，
  # 所以必须仍比主人的 speed 快：1.0 ≈ 193 ms/字。
  guest_speed: 1.0
  # 音高（频率比）。baker 原生中位 F0 = 276 Hz，1.0 = 原声（当前值）。
  # 调节锚点：0.9 ≈ 248 Hz、0.85 ≈ 235 Hz、0.8 ≈ 221 Hz——觉得偏「童声」往低调，
  # 觉得偏「中性/沉」往上调。机制：chunk 的采样率标称为模型率 × pitch，播放层重采样
  # 即整体降调（连共振峰一起降），引擎再用 speed/pitch 补偿语速——speed 管语速、
  # pitch 管音高，两个旋钮互不影响。同 speed：只在 initialize() 读一次，改完要重启。
  pitch: 1.0
  # 合成线程数。弱 CPU 上合成会追不上实时播放——实测一台机器 90–100 ms/字（2 线程），第一段放完时第二段还没合成完，中途断粮（underruns，听感即回答中途卡一下）。4 线程约减半。引擎只在 initialize() 读一次，改完要重启。
  num_threads: 4

  # ── Segmentation and pauses ──────────────────────────────────
  # These numbers are what the listener hears. The model contributes no pause of
  # its own: its lexicon has no punctuation entries at all, and sherpa-onnx's
  # `silence_scale` measured as inert (0.2 and 0.0 produced byte-identical
  # audio). The playback layer writes each pause below as real silence frames.
  # Measure a model with:  python scripts/calibrate_tts_pauses.py
  # Preview a reply with:  python scripts/show_segmentation.py "…"
  first_chunk_max_chars: 16    # short first chunk → early first sound; the rest synthesises while it plays
  clause_max_chars: 24         # most characters spoken between two audible pauses (a breath at the comma)
  chunk_max_chars: 40          # if nothing ends within clause_max_chars, look this far for a boundary
  chunk_min_chars: 10          # anything shorter is merged back into its neighbour
  hard_max_chars: 80           # a run with no punctuation at all is only broken past this ceiling
  reply_max_chars: 240         # an agent's answer (tool one-liners keep the contract's 80)
  tail_silence_ms: 150         # silence after the last sentence, before the microphone re-opens
  pause_sentence_ms: 240       # 。
  pause_question_ms: 280       # ？
  pause_exclaim_ms: 260        # ！
  pause_ellipsis_ms: 420       # ……
  pause_semicolon_ms: 200      # ；
  pause_comma_ms: 140          # ，
  pause_enumeration_ms: 100    # 、
  pause_colon_ms: 180          # ：
  pause_paragraph_ms: 420      # newline
  pause_forced_ms: 60          # a cut with no punctuation at all
  pause_conjunction_ms: 90     # a cut placed before 但是 / 所以 / 然后 …

  # ── Edge-silence trimming ────────────────────────────────────
  # Every synthesis call carries near-silence at each end (a noise floor, not
  # digital zeros). Measured: Matcha 60–110 ms per end at a floor of 0.24–1.68 %
  # of peak; the 8 kHz fallback 80–250 ms at 0.78–1.74 %. Left in, it is added to
  # every pause in the table above.
  trim_silence: true
  trim_ratio: 0.02             # threshold = peak × this — above every measured floor (max 1.74 %),
                               # ~20× below the quietest onset (~35 %), so it trims every segment alike
  trim_guard_ms: 30            # audio kept around the detected speech, so onsets are never clipped

  # 句内空隙压缩（实测：Matcha 每次 generate() 会在句中自掏 1–7 个 40–240 ms 的
  # 静音洞——词表无标点，它看不到逗号，停顿位置随缘）。超过 max_internal_gap_ms 的
  # 句中静音压回 internal_gap_keep_ms；0 = 关闭。60/30 是「语流连续」档：60 ms 以下
  # 的自然微停顿（含塞音闭合）保留，70–110 ms 的词间洞压到 30 ms——再大会听出碎片，
  # 再小会把辅音挤掉。首尾静音仍由上面三项处理。热生效（每回合重读）。
  max_internal_gap_ms: 60
  internal_gap_keep_ms: 30

tools:
  # ── 语音可打开的应用 ──
  # 内置 9 个(记事本/计算器/资源管理器/命令提示符/命令行窗口/代码编辑器/
  # 谷歌浏览器/微软浏览器/系统设置)始终可用,且按 App Paths/PATH 自适应机器。
  # 此表由设置界面(winvoice.webui)写入,追加自定义应用;内置 id 不可覆盖。
  #   id      内部标识(小写英文;语音里用 label,这里主要用于日志与 sensitive_apps)
  #   label   语音里怎么称呼(中文,TTS 只能念中文)
  #   command 启动命令:绝对路径(如微信装在自定义位置),或 App Paths/PATH 里的 exe 名
  #   image   进程映像名(启动命令≠进程映像时必填,如 Weixin.exe);省略则从 command 推断
  #   guest   true = 访客也可以打开(默认 false;内置应用不受此项控制)
  apps:
    - id: wechat
      command: C:\Program Files\Tencent\Weixin\Weixin.exe
      label: 微信
      image: Weixin.exe
      guest: false
    - id: appmupkpuq5
      command: C:\Program Files\NetEase\CloudMusic\cloudmusic.exe
      label: 网易云音乐
      image: cloudmusic.exe
      guest: false
  # 访客一律禁开的应用(即使 guest=true 或属于内置),设置界面可改。
  sensitive_apps:
    - "cmd"
    - "powershell"
  destructive:
    - "write_file"
    - "run_script"
  confirm_required: true       # Require double confirmation for destructive tools
  # 二次确认回路（语音层）：write_file / run_script / system_power 需要用户说
  # 「确认」才执行；挂起的调用超过 confirm_timeout_s 秒未确认即作废。下一句
  # 非确认话同样作废，按新指令处理。
  confirm_timeout_s: 15
  # 「搜索 X」先问一句再开浏览器（确认词同样是「确认/取消」）。false = 旧行为，
  # 显式搜索立刻打开。只作用于语音路径；Agent 经 MCP 调用不受影响。
  search_web_confirm: true
  # Check each tool's postcondition against real machine state after it runs
  # (open_app -> is the process there? close_app -> is it gone? write_file -> is
  # the content on disk?). A tool's own "success" is a claim; this is evidence,
  # and it is what decides whether a failed turn is escalated to the cloud.
  verification_enabled: true
  # Where the audio process publishes the in-flight speaker tier. The MCP server
  # that DeepSeek Harness calls tools through runs in a different process, and
  # this file is the only channel that survives that hop — without it a guest
  # could reach read_file/write_file/run_script through the agent.
  utterance_file: "runtime/utterance.json"

# ──────────────────────────────────────────────────────────────
# DeepSeek Harness — the agent layer (see docs/dsh_integration_design.md)
#
# Off by default. When `dsh.local.enabled` is true, requests that no rule
# answers are handed to the agent, which plans, calls tools and composes the
# spoken reply. The tools themselves are unchanged: DSH reaches this project's
# registry over MCP (winvoice/mcp_server.py), so the allowlist, snapshots,
# permission tiers and verifiers all still apply.
#
# Requires: .pylibs (mcp, deepseek-harness-sdk, deepseek-harness-runtime-bin)
# and the bridge bundle — run `python scripts/install_dsh_bridge.py --install`.
# ──────────────────────────────────────────────────────────────
dsh:
  enabled: true                # master switch; also requires dsh.local.enabled
  escalation_enabled: true     # allow Local -> Cloud when the machine disagrees
  max_local_attempts: 2        # 2 = one retry for a `retryable` verification failure

  # The DeepSeek adapter defaults to reasoningEffort=high with thinking enabled,
  # so even 「现在几点」 pays for high-effort reasoning. This sets the policy on
  # that adapter's own row; it is inert unless a tier selects `deepseek-official`.
  #
  # Per-tier `reasoning_effort` below stays EMPTY on purpose: a hand-declared
  # route whose model declares `reasoningEfforts: false` (a plain instruct model
  # such as qwen2.5-3b) REJECTS an explicit effort with
  #   provider "x" model "y" does not support reasoning effort "off"
  # Omitting it uses the model's own default, which is right for a non-reasoning
  # model and costs nothing.
  reasoning_effort: "off"

  # Hand-declared OpenAI-compatible routes. Each key is the name a request
  # selects through `provider:` below. A route the installed pi-ai catalog does
  # not describe — a local llama.cpp server, NVIDIA NIM — has to be spelled out,
  # or the SDK fails at initialize with
  #   no adapter registered for provider "<name>"
  # `api_key_env` names the variable holding the key; the key itself never
  # belongs in this file.
  providers:
    local-llamacpp:
      display_name: "本地 llama.cpp"
      api: openai-completions
      base_url: "http://localhost:8080/v1"
      api_key_env: "WINVOICE_LOCAL_LLM_KEY"
      # pi-ai insists a route carries a key even when the server ignores it:
      #   NO api_key_env  -> "No API key for provider: local-llamacpp" (PI_AI_ERROR)
      #   api_key_env set -> "no credential ... which is not set" (MISSING_CREDENTIAL)
      # `placeholder_key` settles it: the app exports a dummy value into the
      # runtime's environment, so the route authenticates and llama.cpp ignores
      # the header. Only use it for a server that really does not check.
      placeholder_key: true
      models:
        - id: "qwen2.5-3b-instruct"
          context_window: 32768
          max_tokens: 2048
    nvidia:
      display_name: "NVIDIA NIM"
      api: openai-completions
      base_url: "https://integrate.api.nvidia.com/v1"
      api_key_env: "NVIDIA_API_KEY"
      # STATUS: declared, but NOT working yet. A hand-declared pi-ai route could
      # not be given a credential by any route tried so far — the process
      # environment is ignored (`No API key for provider: x`) and so is a
      # `version: 1 / refs:` entry in $DSH_HOME/.credentials.yaml
      # (`MISSING_CREDENTIAL`). The likely fix is to save the key through the
      # DSH Models page, which writes the credential store properly.
      #
      # Pointing the *deepseek* adapter at NVIDIA instead does resolve the
      # credential (it gets past MISSING_CREDENTIAL to an HTTP error), so the
      # cheaper path is `provider: deepseek-official` with
      #   base_url: https://integrate.api.nvidia.com
      # and a real NVIDIA_API_KEY. That probe returned HTTP 404 with a dummy
      # key, which with an invalid key cannot be told apart from an unknown
      # model id — so confirm the exact id your account serves, e.g.
      #   deepseek-ai/deepseek-r1
      #   meta/llama-3.3-70b-instruct
      models:
        - id: "deepseek-ai/deepseek-r1"
          context_window: 131072
          max_tokens: 4096
    deepseek-cloud:
      display_name: "DeepSeek 官方"
      api: openai-completions
      base_url: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"
      models:
        - id: "deepseek-v4-flash"
          context_window: 200000
          max_tokens: 4096

  # Composed-profile rows switched off. Every mounted tool puts its full
  # description into *every* request, and several also give the agent a route to
  # the machine that bypasses ToolExecutor — so they cost tokens and weaken the
  # allowlist at the same time. The only route the agent should have is
  # mcp__winvoice__*. Unknown ids are skipped with a warning, not an error.
  disabled_rows:
    - tool-bash               # shell
    - tool-pwsh
    - tool-fs                 # read/write/edit/glob/grep across the machine
    - tool-fs-search
    - tool-str-replace-editor
    - tool-web                # web search + fetch (the assistant has its own)
    - tool-subagent           # nested agents: pure token cost for a voice turn
    - tool-subagent-fork
    - tool-subagent-control
    - tool-subagent-list-agents
    - tool-workflow
    - tool-ralph
    - tool-goal
    - tool-jobs
    - tool-skill
    - tool-todo
    - session-title-llm       # one extra LLM call per session, just to title it

  local:
    enabled: true
    dsh_home: "runtime/dsh_home"   # this project's own DSH home; ~/.dsh is not used
    # The profile must be one that mounts @deepseek-ai/dsh-llm-pi-ai, because
    # that is the adapter the hand-declared routes hang off. `sdk-minimal` does
    # NOT mount it (verified) — with it every route fails with
    #   no adapter registered for provider "<name>"
    # so this stays `sdk`, and the rows above are switched off individually,
    # which is strictly more controlled anyway.
    profile: "sdk"
    provider: "local-llamacpp"     # a route declared under dsh.providers above
    model: "qwen2.5-3b-instruct"
    reasoning_effort: ""           # see the note above: omit for instruct models
    max_tokens: 2048
    base_url: ""                   # the route above owns the endpoint
    api_key: ""                    # llama-server ignores the key
    initialize_timeout_s: 60
    request_timeout_s: 90          # a wedged turn must not hold the microphone

  cloud:
    enabled: true
    dsh_home: "runtime/dsh_home"
    profile: "sdk"
    # `deepseek-official` is the adapter this was verified against end to end
    # (provider route registered, credential resolved, turn completed). The
    # hand-declared pi-ai routes above could NOT be made to authenticate — see
    # the note under dsh.providers.nvidia.
    provider: "deepseek-official"
    model: "deepseek-v4-flash"
    reasoning_effort: ""
    max_tokens: 4096
    base_url: "https://api.deepseek.com"   # DEEPSEEK_BASE_URL wins over this
    # Deliberately empty. Naming `${DEEPSEEK_API_KEY}` here made the *config
    # load* require the secret, so an unresolved placeholder raised inside every
    # process that touched the config — including the MCP tool server and the
    # whole test suite. The adapter already resolves `DEEPSEEK_API_KEY` from the
    # environment (and the SDK forwards `api_key` into the runtime's env), so
    # this file never needs to mention a credential.
    api_key: ""
    initialize_timeout_s: 60
    request_timeout_s: 90
    guest_allowed: false           # guests cannot reach the cloud tier

  bridge:
    server_name: "winvoice"        # tools appear to the model as mcp__winvoice__<tool>
    tool_timeout_ms: 120000
    bundle_dir: "runtime/dsh_bridge"
    # NOTE: the MCP server reads `tools.utterance_file` (above), not a key here.
    # One path, one owner: two independent keys for the file the guest check
    # travels on is a way to fail that check open, silently.


weather:
  enabled: true  # false → 「天气查询没有打开。」 (no request is made)
  city: 北京  # used when the sentence does not name a city
  # Hard limit for the wttr.in request (wttr.in needs no API key). Keep it
  # small: the assistant says nothing at all until the answer arrives.
  # Read fresh on every call, so editing this needs no restart.
  timeout_s: 5

snapshot:
  enabled: true
  path: "snapshots/"
  max_size_gb: 10

context:
  enabled: true
  scope: "session"             # cleared on sleep
  max_turns: 10

storage:
  max_total_gb: 10             # Total disk quota (models + logs + snapshots)