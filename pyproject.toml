[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winvoice"
version = "0.1.0-dev"
description = "Windows Voice Assistant - Local-first voice assistant with sherpa-onnx"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Windows Voice Assistant Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "sherpa-onnx>=1.12.0",
    "numpy>=2.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.1",
    "watchdog>=5.0.0",
    "structlog>=25.0.0",
    "orjson>=3.10.0",
    "httpx>=0.28.0",
    "tqdm>=4.67.0",
    "requests>=2.32.0",
    "sounddevice>=0.5.0",
    "scipy>=1.13.0",
    "pywin32>=310",
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7.0"]
metrics = ["prometheus-client>=0.20.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "types-requests>=2.32.0",
    "types-PyYAML>=6.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
winvoice = "winvoice.__main__:main"
download-models = "scripts.download_models:main"
analyze-sv = "scripts.analyze_sv_scores:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["winvoice*"]

# NOTE: pytest settings live in pytest.ini only. Duplicating them here makes
# pytest warn "ignoring pytest config in pyproject.toml", so they are omitted
# deliberately.

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "SIM103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"